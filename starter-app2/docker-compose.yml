services:

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-blue:
    image: ${APP_IMAGE:-projet-devops:latest}
    profiles: ["blue"]

    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      DEPLOY_COLOR: blue

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app-network

  app-green:
    image: ${APP_IMAGE:-projet-devops:latest}
    profiles: ["green"]

    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      DEPLOY_COLOR: green

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app-network

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app-network

networks:
  app-network:

volumes:
  redis-data:
